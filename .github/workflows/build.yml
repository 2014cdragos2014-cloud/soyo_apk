name: Compilar APK SOYO

on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libffi-dev libssl-dev build-essential ccache

      - name: Instalar Buildozer y Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Aceptar licencias de Android SDK
        run: |
          mkdir -p ~/.android
          echo "### Turist stamp" > ~/.android/repositories.cfg

      - name: Compilar APK con Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Subir APK generada
        uses: actions/upload-artifact@v4
        with:
          name: SOYO-APK
          path: bin/*.apk
