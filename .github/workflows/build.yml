name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Asegurar pip compatible (< 24)
        run: |
          python -m pip install --upgrade "pip<24" setuptools wheel

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            python3-dev \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libreadline-dev \
            libsqlite3-dev \
            libssl-dev \
            libffi-dev

      - name: Instalar Buildozer y Cython
        run: |
          pip install --upgrade cython==0.29.36 buildozer

      - name: Aceptar licencias de Android SDK
        run: |
          mkdir -p ~/.android
          echo "### License accepted by Android SDK" > ~/.android/repositories.cfg

      - name: Restaurar Caché de Buildozer
        uses: actions/cache@v3
        with:
          path: |
            .buildozer
            bin/
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}-${{ hashFiles('main.py') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Compilar APK con Buildozer
        run: |
          buildozer -v android debug

      - name: Subir APK generada
        uses: actions/upload-artifact@v4
        with:
          name: app-release-debug
          path: bin/*.apk
